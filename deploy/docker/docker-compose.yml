services:
  nasdsh:
    image: nasdsh:${NASDSH_VERSION:-0.1.0}
    # 也可以直接用离线包：docker load -i nasdsh-<ver>-docker-amd64.tar.gz
    container_name: nasdsh
    restart: unless-stopped
    ports:
      - "${NASDSH_PORT:-12704}:8080"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 允许的项目根（冒号分隔）。fnOS 一般是 /vol1；UGOS 是 /volume1:/volume2…
      # 留空则自动探测 /volume* 与 /home
      - NASDSH_ROOTS=${NASDSH_ROOTS:-}
      # 共享 Web 的默认工作目录（默认取第一个允许根）
      - NASDSH_WEB_CWD=${NASDSH_WEB_CWD:-}
      # 额外信任的访问 authority（逗号分隔，UGREENlink/反代域名需要）
      - NASDSH_TRUSTED_HOSTS=${NASDSH_TRUSTED_HOSTS:-}
      # 可选访问口令（留空=不启用）
      - TERM_PIN=${TERM_PIN:-}
      # 模型 API Key（留空=不启用；也可稍后在 dsh Web Settings → Models 里配置）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - BIGMODEL_API_KEY=${BIGMODEL_API_KEY:-}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:-}
      - TOKENPLAN_API_KEY=${TOKENPLAN_API_KEY:-}
    volumes:
      # 持久数据（dsh profile/凭据/会话/日志），建议放 SSD 数据卷
      - ${DATA_PATH:?请在 .env 设置 DATA_PATH}:/data
      # 项目目录：按原路径挂载（路径容器内外一致）
      - ${PROJECTS_PATH:?请在 .env 设置 PROJECTS_PATH}:${PROJECTS_PATH}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
